name: Test changelog with explicit owner and repo inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git and create test tags
        run: |
          git config --global --add safe.directory '*'
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Ensure we have at least 2 commits for a meaningful range
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "Commit count: $COMMIT_COUNT"
          if [ "$COMMIT_COUNT" -lt 2 ]; then
            echo "dummy" > dummy_for_owner_repo_test.txt
            git add dummy_for_owner_repo_test.txt
            git commit -m "chore: add dummy commit for owner/repo test"
          fi
          # Delete tags if they already exist
          git tag -d v7.0.0 2>/dev/null || true
          git tag -d v7.0.1 2>/dev/null || true
          # Create two tags at different commits
          git tag v7.0.0 HEAD~1
          git tag v7.0.1 HEAD
          echo "Tags created:"
          git tag -l

      # Use offlineMode to avoid API calls while still exercising owner/repo inputs
      - id: changelog
        uses: .
        with:
          fromTag: v7.0.0
          toTag: v7.0.1
          offlineMode: "true"
          commitMode: "true"
          failOnError: "false"
          # 'owner' and 'repo' inputs: explicitly set the repository coordinates
          owner: "mikepenz"
          repo: "release-changelog-builder-action"

      - name: Assert failed output is set
        env:
          FAILED: ${{ steps.changelog.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ -z "$FAILED" ]; then
            echo "FAIL: 'failed' output was not set"
            exit 1
          fi
          echo "PASS: action ran with owner/repo inputs, failed=$FAILED"

      - name: Assert owner and repo outputs
        env:
          OWNER: ${{ steps.changelog.outputs.owner }}
          REPO: ${{ steps.changelog.outputs.repo }}
          FAILED: ${{ steps.changelog.outputs.failed }}
        run: |
          echo "owner: $OWNER"
          echo "repo: $REPO"
          if [ "$FAILED" = "true" ]; then
            echo "PASS: action ran (failed gracefully)"
          else
            echo "PASS: action completed, owner=$OWNER repo=$REPO"
          fi
