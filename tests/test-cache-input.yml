name: Test cache input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create test tags for changelog range
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag cache-input-to-tag HEAD
          PARENT=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          git tag cache-input-from-tag "$PARENT"

      - id: first_run
        uses: .
        with:
          fromTag: cache-input-from-tag
          toTag: cache-input-to-tag
          offlineMode: "true"
          commitMode: "true"
          failOnError: "false"
          exportCache: "true"

      - name: Assert first run did not fail
        env:
          FAILED: ${{ steps.first_run.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" = "true" ]; then
            echo "FAIL: first run reported failure"
            exit 1
          fi
          echo "PASS: first run completed without failure"

      - id: second_run
        uses: .
        with:
          fromTag: cache-input-from-tag
          toTag: cache-input-to-tag
          offlineMode: "true"
          commitMode: "true"
          failOnError: "false"
          cache: ${{ steps.first_run.outputs.cache }}

      - name: Assert second run did not fail
        env:
          FAILED: ${{ steps.second_run.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" = "true" ]; then
            echo "FAIL: second run (with cache input) reported failure"
            exit 1
          fi
          echo "PASS: action completed with cache input without failure"

      - name: Assert toTag output is set in second run
        env:
          TO_TAG: ${{ steps.second_run.outputs.toTag }}
        run: |
          echo "toTag: $TO_TAG"
          if [ -z "$TO_TAG" ]; then
            echo "FAIL: toTag output is empty in second run"
            exit 1
          fi
          echo "PASS: toTag is set to '$TO_TAG'"
