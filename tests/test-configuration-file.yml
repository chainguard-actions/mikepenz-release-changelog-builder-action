name: Test configuration file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create configuration file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.changelog-config"
          cat > "$GITHUB_WORKSPACE/.changelog-config/config.json" << 'EOF'
          {
            "categories": [
              {
                "title": "## 🚀 Features",
                "labels": ["feature"]
              },
              {
                "title": "## 🐛 Bug Fixes",
                "labels": ["bug"]
              }
            ],
            "template": "${{CHANGELOG}}\n\n${{UNCATEGORIZED}}",
            "pr_template": "- ${{TITLE}}\n   - PR: #${{NUMBER}}",
            "empty_template": "- no changes",
            "label_extractor": [],
            "duplicate_filter": {},
            "transformers": [],
            "max_tags_to_fetch": 200,
            "max_pull_requests": 200,
            "max_back_track_time_days": 365,
            "exclude_merge_branches": [],
            "tag_resolver": {
              "method": "semver"
            },
            "base_branches": []
          }
          EOF

      - name: Create initial commit and tags for offline mode
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag v0.0.1 HEAD~1 2>/dev/null || git tag v0.0.1 HEAD
          git tag v0.0.2 HEAD 2>/dev/null || true

      - id: action
        uses: .
        with:
          configuration: ".changelog-config/config.json"
          fromTag: "v0.0.1"
          toTag: "v0.0.2"
          offlineMode: "true"
          commitMode: "true"
          failOnError: "false"

      - name: Assert failed output is false or action ran
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" = "true" ]; then
            echo "FAIL: action reported failure"
            exit 1
          fi
          echo "PASS: action ran without failure"

      - name: Assert changelog output exists
        env:
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "changelog: $CHANGELOG"
          echo "PASS: changelog output received (may be empty for offline mode)"
