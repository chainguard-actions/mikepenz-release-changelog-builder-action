name: Test configuration file and includeOnlyPaths inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v2.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup git tags and config file
        run: |
          git config user.email "test@example.com"
          git config user.name "Test"
          git tag v1.0.0 HEAD~1 2>/dev/null || git tag v1.0.0 HEAD
          git tag v2.0.0 HEAD 2>/dev/null || true
          # Write a changelog config file
          cat > /tmp/changelog-config.json << 'EOF'
          {
            "categories": [
              {
                "title": "## Changes",
                "labels": []
              }
            ],
            "template": "#{{CHANGELOG}}",
            "pr_template": "- #{{TITLE}}"
          }
          EOF

      - id: changelog
        uses: .
        with:
          fromTag: v1.0.0
          toTag: v2.0.0
          configuration: /tmp/changelog-config.json
          baseUrl: https://api.github.com
          includeOnlyPaths: |
            src/
            lib/
          mode: COMMIT
          offlineMode: "true"
          failOnError: "false"

      - name: Assert action completed
        env:
          FAILED: ${{ steps.changelog.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          echo "PASS: action completed with configuration file, baseUrl, and includeOnlyPaths inputs"
