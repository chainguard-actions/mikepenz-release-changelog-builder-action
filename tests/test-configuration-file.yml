name: Test configuration file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create test tags for changelog range
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag config-file-to-tag HEAD
          PARENT=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          git tag config-file-from-tag "$PARENT"

      - id: changelog
        uses: .
        with:
          fromTag: config-file-from-tag
          toTag: config-file-to-tag
          offlineMode: "true"
          commitMode: "true"
          failOnError: "false"
          configuration: "hardened/tests/fixtures/changelog-config.json"

      - name: Assert action did not fail
        env:
          FAILED: ${{ steps.changelog.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" = "true" ]; then
            echo "FAIL: action reported failure when using configuration file"
            exit 1
          fi
          echo "PASS: action completed without failure"

      - name: Assert fromTag output is set
        env:
          FROM_TAG: ${{ steps.changelog.outputs.fromTag }}
        run: |
          echo "fromTag: $FROM_TAG"
          if [ -z "$FROM_TAG" ]; then
            echo "FAIL: fromTag output is empty"
            exit 1
          fi
          echo "PASS: fromTag is set to '$FROM_TAG'"
