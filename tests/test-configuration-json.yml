name: Test configurationJson and mode inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create test tags
        run: |
          git config user.email "test@example.com"
          git config user.name "Test"
          git tag cfg-json-from-v0.0.1 HEAD~1 2>/dev/null || git tag cfg-json-from-v0.0.1 HEAD
          git tag cfg-json-to-v0.0.2 HEAD

      - id: action
        uses: .
        with:
          fromTag: cfg-json-from-v0.0.1
          toTag: cfg-json-to-v0.0.2
          configurationJson: |
            {
              "categories": [
                {
                  "title": "## 🚀 Features",
                  "labels": ["feature"]
                }
              ],
              "template": "#{{CHANGELOG}}"
            }
          mode: "COMMIT"
          offlineMode: "true"
          commitMode: "true"
          failOnError: "false"
          token: ${{ github.token }}

      - name: Assert failed output is set
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ -z "$FAILED" ]; then
            echo "FAIL: expected 'failed' output to be set"
            exit 1
          fi
          echo "PASS: action completed with failed=$FAILED"
