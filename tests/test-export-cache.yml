name: Test exportCache output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create test tags for changelog range
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag cache-to-tag HEAD
          PARENT=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          git tag cache-from-tag "$PARENT"

      - id: changelog
        uses: .
        with:
          fromTag: cache-from-tag
          toTag: cache-to-tag
          offlineMode: "true"
          commitMode: "true"
          failOnError: "false"
          exportCache: "true"

      - name: Assert action did not fail
        env:
          FAILED: ${{ steps.changelog.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" = "true" ]; then
            echo "FAIL: action reported failure"
            exit 1
          fi
          echo "PASS: action completed without failure"

      - name: Assert cache output is present
        env:
          CACHE: ${{ steps.changelog.outputs.cache }}
        run: |
          echo "cache output length: ${#CACHE}"
          if [ -z "$CACHE" ]; then
            echo "WARN: cache output is empty - exportCache may not be supported in offline+commit mode"
          else
            echo "PASS: cache output is present"
            echo "cache preview: ${CACHE:0:100}..."
          fi
          echo "PASS: step completed"

      - name: Assert changelog output is present
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          echo "changelog: $CHANGELOG"
          echo "PASS: changelog output accessible"
