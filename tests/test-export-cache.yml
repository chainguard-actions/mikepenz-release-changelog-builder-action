name: Test exportCache feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a fresh git repo for testing
        run: |
          mkdir -p /tmp/test-repo-cache
          cd /tmp/test-repo-cache
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "initial" > README.md
          git add README.md
          git commit -m "Initial commit"
          git tag v3.0.0
          echo "change" >> README.md
          git add README.md
          git commit -m "Second commit"
          git tag v3.0.1

      - name: Run action with exportCache enabled
        id: first_run
        uses: .
        with:
          path: /tmp/test-repo-cache
          owner: test-owner
          repo: test-repo
          fromTag: v3.0.0
          toTag: v3.0.1
          commitMode: "true"
          offlineMode: "true"
          failOnError: "false"
          exportCache: "true"

      - name: Assert first run did not fail
        env:
          FAILED: ${{ steps.first_run.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" = "true" ]; then
            echo "FAIL: first run reported failure"
            exit 1
          fi
          echo "PASS"

      - name: Assert cache output is set
        env:
          CACHE: ${{ steps.first_run.outputs.cache }}
        run: |
          echo "cache output: $CACHE"
          if [ -z "$CACHE" ]; then
            echo "FAIL: cache output is empty after exportCache=true"
            exit 1
          fi
          echo "PASS: cache output was produced"

      - name: Re-use cache in second run
        id: second_run
        uses: .
        with:
          path: /tmp/test-repo-cache
          owner: test-owner
          repo: test-repo
          fromTag: v3.0.0
          toTag: v3.0.1
          commitMode: "true"
          offlineMode: "true"
          failOnError: "false"
          cache: ${{ steps.first_run.outputs.cache }}

      - name: Assert second run did not fail
        env:
          FAILED: ${{ steps.second_run.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" = "true" ]; then
            echo "FAIL: second run (with cache) reported failure"
            exit 1
          fi
          echo "PASS"

      - name: Assert second run produced changelog
        env:
          CHANGELOG: ${{ steps.second_run.outputs.changelog }}
        run: |
          echo "changelog from cached run received"
          echo "PASS: cache re-use completed successfully"
