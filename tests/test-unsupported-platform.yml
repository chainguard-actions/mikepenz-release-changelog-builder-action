name: Test unsupported platform fails the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          platform: bitbucket
          offlineMode: "true"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported platform"; exit 1
          fi
          if [ -n "$CHANGELOG" ]; then
            echo "FAIL: changelog should not be produced"; exit 1
          fi
          echo "PASS"
