name: Test includeOnlyPaths input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          mode: "COMMIT"
          offlineMode: "true"
          fromTag: "HEAD~1"
          toTag: "HEAD"
          includeOnlyPaths: |
            src/**
            lib/**
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert action ran without failure
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" = "true" ]; then
            echo "FAIL: action reported failure with includeOnlyPaths set"
            exit 1
          fi
          echo "PASS"
