name: Test includeOnlyPaths input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git and create unique test tags for changelog range
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          TS=$(date +%s)
          FROM_TAG="test-paths-from-${TS}"
          TO_TAG="test-paths-to-${TS}"
          git tag "$FROM_TAG" HEAD
          # Create a commit touching a specific path
          mkdir -p test-include-paths-dir
          echo "include-paths-marker-${TS}" > test-include-paths-dir/marker.txt
          git add test-include-paths-dir/marker.txt
          git commit -m "feat: add file in specific path for includeOnlyPaths test"
          git tag "$TO_TAG" HEAD
          echo "FROM_TAG=$FROM_TAG" >> "$GITHUB_ENV"
          echo "TO_TAG=$TO_TAG" >> "$GITHUB_ENV"

      - id: changelog
        uses: .
        with:
          fromTag: ${{ env.FROM_TAG }}
          toTag: ${{ env.TO_TAG }}
          offlineMode: "true"
          commitMode: "true"
          failOnError: "false"
          includeOnlyPaths: |
            test-include-paths-dir/**

      - name: Assert action did not fail
        env:
          FAILED: ${{ steps.changelog.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" = "true" ]; then
            echo "FAIL: action reported failure when using includeOnlyPaths"
            exit 1
          fi
          echo "PASS: action succeeded with includeOnlyPaths"

      - name: Assert fromTag and toTag outputs
        env:
          FROM_TAG_OUT: ${{ steps.changelog.outputs.fromTag }}
          TO_TAG_OUT: ${{ steps.changelog.outputs.toTag }}
        run: |
          echo "fromTag: $FROM_TAG_OUT"
          echo "toTag: $TO_TAG_OUT"
          if [ -z "$FROM_TAG_OUT" ] || [ -z "$TO_TAG_OUT" ]; then
            echo "FAIL: fromTag or toTag output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert changelog output is set
        env:
          ACTUAL: ${{ steps.changelog.outputs.changelog }}
        run: |
          echo "changelog: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: changelog output is empty"
            exit 1
          fi
          echo "PASS: changelog output is set"
