name: Test offline commit mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a fresh git repo for testing
        run: |
          mkdir -p /tmp/test-repo
          cd /tmp/test-repo
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "initial" > README.md
          git add README.md
          git commit -m "Initial commit"
          git tag v0.0.1
          echo "change" >> README.md
          git add README.md
          git commit -m "Second commit"
          git tag v0.0.2

      - id: build_changelog
        uses: .
        with:
          path: /tmp/test-repo
          owner: test-owner
          repo: test-repo
          fromTag: v0.0.1
          toTag: v0.0.2
          commitMode: "true"
          offlineMode: "true"
          failOnError: "false"

      - name: Assert failed output is false
        env:
          FAILED: ${{ steps.build_changelog.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" = "true" ]; then
            echo "FAIL: action reported failure"
            exit 1
          fi
          echo "PASS"

      - name: Assert fromTag output
        env:
          FROM_TAG: ${{ steps.build_changelog.outputs.fromTag }}
        run: |
          echo "fromTag: $FROM_TAG"
          if [ -z "$FROM_TAG" ]; then
            echo "FAIL: fromTag output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert toTag output
        env:
          TO_TAG: ${{ steps.build_changelog.outputs.toTag }}
        run: |
          echo "toTag: $TO_TAG"
          if [ -z "$TO_TAG" ]; then
            echo "FAIL: toTag output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert changelog output is set
        env:
          CHANGELOG: ${{ steps.build_changelog.outputs.changelog }}
        run: |
          echo "changelog: $CHANGELOG"
          # changelog may be empty if no commits between tags, but output should exist
          echo "PASS: changelog output was produced"
