name: Test configurationJson input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config and isolated repo for testing
        run: |
          set -e
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
          git config --global safe.directory '*'

          REPO_DIR="/tmp/rcba-config-repo"
          rm -rf "$REPO_DIR"
          mkdir -p "$REPO_DIR"
          cd "$REPO_DIR"
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Create initial commit and tag it
          echo "base commit for config-json test" > base.txt
          git add base.txt
          git commit -m "chore: base commit for config-json test"
          git tag v1.0.0

          # Create a second commit and tag it
          echo "second commit for config-json test" > second.txt
          git add second.txt
          git commit -m "feat: add feature for config-json test"
          git tag v1.0.1

          echo "Git log:"
          git log --oneline
          echo "Git tags:"
          git tag -l

      - id: action
        uses: .
        with:
          path: /tmp/rcba-config-repo
          fromTag: v1.0.0
          toTag: v1.0.1
          offlineMode: "true"
          commitMode: "true"
          failOnError: "false"
          owner: test-owner
          repo: test-repo
          token: dummy-token-for-offline-mode
          configurationJson: |
            {
              "categories": [
                {
                  "title": "## Features",
                  "labels": ["feature"]
                },
                {
                  "title": "## Fixes",
                  "labels": ["fix"]
                }
              ],
              "template": "#{{CHANGELOG}}",
              "pr_template": "- #{{TITLE}}"
            }

      - name: Assert failed output is false
        env:
          ACTUAL: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $ACTUAL"
          if [ "$ACTUAL" = "true" ]; then
            echo "FAIL: action reported failure when using configurationJson"
            exit 1
          fi
          echo "PASS"

      - name: Assert changelog output is present
        env:
          ACTUAL: ${{ steps.action.outputs.changelog }}
        run: |
          echo "changelog output received"
          echo "PASS: configurationJson was accepted and changelog was produced"
