name: Test outputFile feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git and create unique test tags for changelog range
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          TS=$(date +%s)
          FROM_TAG="test-outfile-from-${TS}"
          TO_TAG="test-outfile-to-${TS}"
          git tag "$FROM_TAG" HEAD
          echo "output-file-marker-${TS}" > test-output-file-marker.txt
          git add test-output-file-marker.txt
          git commit -m "fix: add marker file for output file test"
          git tag "$TO_TAG" HEAD
          echo "FROM_TAG=$FROM_TAG" >> "$GITHUB_ENV"
          echo "TO_TAG=$TO_TAG" >> "$GITHUB_ENV"

      - id: changelog
        uses: .
        with:
          fromTag: ${{ env.FROM_TAG }}
          toTag: ${{ env.TO_TAG }}
          offlineMode: "true"
          commitMode: "true"
          failOnError: "false"
          outputFile: "CHANGELOG_TEST.md"

      - name: Assert action did not fail
        env:
          FAILED: ${{ steps.changelog.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" = "true" ]; then
            echo "FAIL: action reported failure"
            exit 1
          fi
          echo "PASS"

      - name: Assert output file was created
        run: |
          echo "Checking for CHANGELOG_TEST.md..."
          if [ ! -f "$GITHUB_WORKSPACE/CHANGELOG_TEST.md" ]; then
            echo "FAIL: outputFile CHANGELOG_TEST.md was not created"
            exit 1
          fi
          echo "PASS: output file exists"
          echo "Content:"
          cat "$GITHUB_WORKSPACE/CHANGELOG_TEST.md"
