name: Test outputFile feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a fresh git repo for testing
        run: |
          mkdir -p /tmp/test-repo-output
          cd /tmp/test-repo-output
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "initial" > README.md
          git add README.md
          git commit -m "Initial commit"
          git tag v2.0.0
          echo "change" >> README.md
          git add README.md
          git commit -m "Second commit"
          git tag v2.0.1

      - id: build_changelog
        uses: .
        with:
          path: /tmp/test-repo-output
          owner: test-owner
          repo: test-repo
          fromTag: v2.0.0
          toTag: v2.0.1
          commitMode: "true"
          offlineMode: "true"
          failOnError: "false"
          outputFile: CHANGELOG_OUTPUT.md

      - name: Assert action did not fail
        env:
          FAILED: ${{ steps.build_changelog.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" = "true" ]; then
            echo "FAIL: action reported failure"
            exit 1
          fi
          echo "PASS"

      - name: Assert output file was created
        run: |
          if [ ! -f "/tmp/test-repo-output/CHANGELOG_OUTPUT.md" ]; then
            echo "FAIL: outputFile CHANGELOG_OUTPUT.md was not created"
            exit 1
          fi
          echo "Output file contents:"
          cat "/tmp/test-repo-output/CHANGELOG_OUTPUT.md"
          echo "PASS: outputFile was created"
