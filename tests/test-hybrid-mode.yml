name: Test COMMIT mode offline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create test commits and tags
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
          git config --global --add safe.directory '*'
          git tag -f v4.0.0 HEAD
          git commit --allow-empty -m "feat: hybrid mode feature one"
          git commit --allow-empty -m "fix: hybrid mode bug fix"
          git commit --allow-empty -m "chore: hybrid mode maintenance"
          git tag -f v4.1.0 HEAD

      - id: action
        uses: .
        with:
          fromTag: v4.0.0
          toTag: v4.1.0
          offlineMode: "true"
          mode: "COMMIT"
          configurationJson: |
            {
              "template": "## Changes\n#{{CHANGELOG}}#{{UNCATEGORIZED}}",
              "pr_template": "- #{{TITLE}}",
              "empty_template": "- no changes",
              "label_extractor": [],
              "categories": [
                {
                  "title": "## Features",
                  "rules": [
                    {
                      "pattern": "^feat",
                      "on_property": "title",
                      "flags": "i"
                    }
                  ]
                },
                {
                  "title": "## Fixes",
                  "rules": [
                    {
                      "pattern": "^fix",
                      "on_property": "title",
                      "flags": "i"
                    }
                  ]
                }
              ]
            }

      - name: Assert failed is false
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" = "true" ]; then
            echo "FAIL: action reported failure"
            exit 1
          fi
          echo "PASS"

      - name: Assert changelog is non-empty
        env:
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "changelog: $CHANGELOG"
          if [ -z "$CHANGELOG" ]; then
            echo "FAIL: changelog is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert fromTag and toTag outputs
        env:
          FROM_TAG: ${{ steps.action.outputs.fromTag }}
          TO_TAG: ${{ steps.action.outputs.toTag }}
        run: |
          echo "fromTag: $FROM_TAG"
          echo "toTag: $TO_TAG"
          if [ "$FROM_TAG" != "v4.0.0" ]; then
            echo "FAIL: expected fromTag=v4.0.0, got: $FROM_TAG"
            exit 1
          fi
          if [ "$TO_TAG" != "v4.1.0" ]; then
            echo "FAIL: expected toTag=v4.1.0, got: $TO_TAG"
            exit 1
          fi
          echo "PASS"
