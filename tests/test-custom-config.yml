name: Test custom configurationJson
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create test tags for changelog range
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag custom-to-tag HEAD
          PARENT=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          git tag custom-from-tag "$PARENT"

      - id: changelog
        uses: .
        with:
          fromTag: custom-from-tag
          toTag: custom-to-tag
          offlineMode: "true"
          commitMode: "true"
          failOnError: "false"
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}\n\n**Full Changelog**: #{{RELEASE_DIFF}}",
              "pr_template": "- #{{TITLE}} by @#{{AUTHOR}}",
              "empty_template": "- no changes",
              "categories": [
                {
                  "title": "## 🚀 Features",
                  "labels": ["feature", "enhancement"]
                },
                {
                  "title": "## 🐛 Bug Fixes",
                  "labels": ["bug", "fix"]
                }
              ],
              "label_extractor": [],
              "duplicate_filter": {},
              "transformers": [],
              "max_tags_to_fetch": 200,
              "max_pull_requests": 200,
              "max_back_track_time_days": 365
            }

      - name: Assert action did not fail
        env:
          FAILED: ${{ steps.changelog.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" = "true" ]; then
            echo "FAIL: action reported failure with custom configurationJson"
            exit 1
          fi
          echo "PASS: action completed without failure"

      - name: Assert changelog output is present
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          echo "changelog: $CHANGELOG"
          if [ -z "$CHANGELOG" ]; then
            echo "WARN: changelog is empty (may be expected if no commits in range)"
          else
            echo "PASS: changelog output is present"
          fi
          echo "PASS: configurationJson was accepted"

      - name: Assert owner output is set
        env:
          OWNER: ${{ steps.changelog.outputs.owner }}
        run: |
          echo "owner: $OWNER"
          if [ -z "$OWNER" ]; then
            echo "WARN: owner output is empty (may be expected in offline mode)"
          fi
          echo "PASS: step completed"
