name: Test offline basic changelog generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git and create test tags
        run: |
          git config --global --add safe.directory '*'
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Ensure we have at least 2 commits for a meaningful range
          # Create a dummy commit if needed
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "Commit count: $COMMIT_COUNT"
          if [ "$COMMIT_COUNT" -lt 2 ]; then
            echo "dummy" > /tmp/dummy_file.txt
            cp /tmp/dummy_file.txt dummy_for_test.txt
            git add dummy_for_test.txt
            git commit -m "chore: add dummy commit for test range"
          fi
          # Delete tags if they already exist
          git tag -d v0.0.1 2>/dev/null || true
          git tag -d v0.0.2 2>/dev/null || true
          # Create two tags at different commits
          git tag v0.0.1 HEAD~1
          git tag v0.0.2 HEAD
          echo "Tags created:"
          git tag -l

      - id: changelog
        uses: .
        with:
          fromTag: v0.0.1
          toTag: v0.0.2
          offlineMode: "true"
          commitMode: "true"
          failOnError: "false"

      - name: Assert failed output is set
        env:
          FAILED: ${{ steps.changelog.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ -z "$FAILED" ]; then
            echo "FAIL: 'failed' output was not set"
            exit 1
          fi
          echo "PASS: 'failed' output is set to '$FAILED'"

      - name: Assert changelog output is set
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          FAILED: ${{ steps.changelog.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          echo "changelog: $CHANGELOG"
          if [ "$FAILED" = "true" ]; then
            echo "PASS: action ran (failed gracefully in offline mode)"
          else
            echo "PASS: action completed successfully"
          fi

      - name: Assert fromTag output
        env:
          FROM_TAG: ${{ steps.changelog.outputs.fromTag }}
          FAILED: ${{ steps.changelog.outputs.failed }}
        run: |
          echo "fromTag: $FROM_TAG"
          echo "failed: $FAILED"
          if [ "$FAILED" = "true" ]; then
            echo "PASS: action ran (failed gracefully, skipping fromTag check)"
          elif [ -z "$FROM_TAG" ]; then
            echo "FAIL: fromTag output was not set"
            exit 1
          else
            echo "PASS: fromTag is '$FROM_TAG'"
          fi

      - name: Assert toTag output
        env:
          TO_TAG: ${{ steps.changelog.outputs.toTag }}
          FAILED: ${{ steps.changelog.outputs.failed }}
        run: |
          echo "toTag: $TO_TAG"
          echo "failed: $FAILED"
          if [ "$FAILED" = "true" ]; then
            echo "PASS: action ran (failed gracefully, skipping toTag check)"
          elif [ -z "$TO_TAG" ]; then
            echo "FAIL: toTag output was not set"
            exit 1
          else
            echo "PASS: toTag is '$TO_TAG'"
          fi
