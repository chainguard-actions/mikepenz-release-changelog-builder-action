name: Test mode input (COMMIT mode)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          mode: "COMMIT"
          offlineMode: "true"
          fromTag: "HEAD~1"
          toTag: "HEAD"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert failed output is false
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" = "true" ]; then
            echo "FAIL: action reported failure with mode=COMMIT"
            exit 1
          fi
          echo "PASS"
      - name: Assert changelog output exists
        env:
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "changelog: $CHANGELOG"
          if [ -z "$CHANGELOG" ]; then
            echo "WARN: changelog is empty, but action did not fail"
          fi
          echo "PASS"
